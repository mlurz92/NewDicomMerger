name: Apply Final Source To Main

on:
  push:
    branches:
      - main
    paths:
      - .apply-final-source-main-trigger
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .apply-final-source-main-pr-trigger
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .apply-final-source-main-pr-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || !contains(github.event.head_commit.message, '[apply-final]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and verify final source
        shell: pwsh
        run: ./scripts/materialize-final-source.ps1

      - name: Commit applied source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (-not (git status --porcelain)) { throw 'No materialized source changes were produced.' }
          git commit -m 'Apply final corrections to production source [apply-final]'
          git push origin HEAD:main
