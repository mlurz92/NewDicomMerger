name: Apply Final Source To Main

on:
  push:
    branches:
      - main
    paths:
      - .apply-final-source-main-trigger
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .apply-final-source-main-pr-trigger
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .apply-final-source-main-pr-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || !contains(github.event.head_commit.message, '[apply-final]') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and verify final source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            ./scripts/materialize-final-source.ps1
          } catch {
            $_ | Format-List * -Force | Out-String | Set-Content materialize-error.txt -Encoding utf8
            $critical = @(
              'App.xaml.cs',
              'MainWindow.xaml.cs',
              'Services/BatchReportGenerator.cs',
              'Services/BatchReportWriter.cs',
              'Services/DicomDirWriter.cs',
              'Services/DicomScanner.cs',
              'Services/DiffusionBValueHelper.cs',
              'Services/FrameMerger.cs',
              'Services/FrameSplitter.cs',
              'Services/NiftiConverter.cs',
              'Services/SeriesDeidentifier.cs',
              'Services/SevenZipHelper.cs'
            )
            $critical | ForEach-Object {
              if (Test-Path $_ -PathType Leaf) {
                [pscustomobject]@{
                  Path = $_
                  Length = (Get-Item $_).Length
                  SHA256 = (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
            } | Export-Csv materialize-hashes.csv -NoTypeInformation -Encoding utf8
            throw
          }

      - name: Upload materialization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-source-materialization-diagnostics
          path: |
            materialize-error.txt
            materialize-hashes.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit applied source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (-not (git status --porcelain)) { throw 'No materialized source changes were produced.' }
          git commit -m 'Apply final corrections to production source [apply-final]'
          git push origin HEAD:main
