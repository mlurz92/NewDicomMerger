name: .NET 10 BugHunt Fix Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net10-bughunt-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-fixes:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Install .NET SDK 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Reconstruct built source and apply BugHunt fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item 'bin', 'obj', 'publish', 'artifacts', 'BugHuntHarness\bin', 'BugHuntHarness\obj' -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force 'artifacts\reports' | Out-Null

          $overlayParts = @(Get-ChildItem '.build-overlay\part_*.b64' | Sort-Object Name)
          if ($overlayParts.Count -ne 8) { throw "Expected 8 build-overlay parts, found $($overlayParts.Count)." }
          $overlayBase64 = ($overlayParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $overlayBase64 = $overlayBase64 -replace '\s', ''
          $overlayZip = Join-Path $env:RUNNER_TEMP 'reviewed-final-files.zip'
          [IO.File]::WriteAllBytes($overlayZip, [Convert]::FromBase64String($overlayBase64))
          Expand-Archive -LiteralPath $overlayZip -DestinationPath $PWD -Force

          $fixParts = @(Get-ChildItem '.bughunt-fixes\part_*.b64' | Sort-Object Name)
          if ($fixParts.Count -ne 8) { throw "Expected 8 BugHunt fix parts, found $($fixParts.Count)." }
          $fixBase64 = ($fixParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $fixBase64 = $fixBase64 -replace '\s', ''
          if ($fixBase64.Length -ne 60876) { throw "Unexpected BugHunt base64 length: $($fixBase64.Length)." }
          $fixBase64Hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($fixBase64))).ToLowerInvariant()
          if ($fixBase64Hash -ne 'cf5a7265ae39d15b1eb8cd3930c34cd197e68288efb8bd89c27337074d2f0781') { throw "BugHunt base64 hash mismatch: $fixBase64Hash" }
          $compressedPatch = [Convert]::FromBase64String($fixBase64)
          $compressedHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($compressedPatch)).ToLowerInvariant()
          if ($compressedHash -ne '4f89bd40fe3ab1f833a08e54346461f6f8126ce96d515532d6572c5c0d232e1d') { throw "Compressed patch hash mismatch: $compressedHash" }
          $patchPath = Join-Path $env:RUNNER_TEMP 'bughunt-fixes.patch'
          $input = [IO.MemoryStream]::new($compressedPatch)
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try {
              $output = [IO.File]::Create($patchPath)
              try { $gzip.CopyTo($output) } finally { $output.Dispose() }
            } finally { $gzip.Dispose() }
          } finally { $input.Dispose() }
          $patchHash = (Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne '4decaeea1f0c9d43ad3e51fb386aea25b178800a508c9088ce2285f273f88985') { throw "Patch hash mismatch: $patchHash" }

          $patchTargets = @(
            'App.xaml.cs',
            'MainWindow.xaml.cs',
            'NewDicomMerger.csproj',
            'Services\BatchReportGenerator.cs',
            'Services\BatchReportWriter.cs',
            'Services\DicomDirWriter.cs',
            'Services\DicomScanner.cs',
            'Services\DiffusionBValueHelper.cs',
            'Services\FrameSplitter.cs',
            'Services\NiftiConverter.cs',
            'Services\SeriesDeidentifier.cs',
            'Services\SevenZipHelper.cs'
          )
          $utf8 = [Text.UTF8Encoding]::new($false)
          foreach ($target in $patchTargets) {
            $content = [IO.File]::ReadAllText($target)
            $content = $content.Replace("`r`n", "`n").Replace("`r", "`n")
            [IO.File]::WriteAllText($target, $content, $utf8)
          }
          New-Item -ItemType Directory -Force 'BugHuntHarness' | Out-Null
          [IO.File]::WriteAllText('BugHuntHarness\BugHuntHarness.csproj', '', $utf8)
          [IO.File]::WriteAllText('BugHuntHarness\Program.cs', '', $utf8)

          git apply --check --exclude=Services/FrameMerger.cs --ignore-space-change --ignore-whitespace --whitespace=nowarn $patchPath
          git apply --exclude=Services/FrameMerger.cs --ignore-space-change --ignore-whitespace --whitespace=nowarn $patchPath

          $frameParts = @(Get-ChildItem '.bughunt-frame\part_*.b64' | Sort-Object Name)
          if ($frameParts.Count -ne 2) { throw "Expected 2 FrameMerger payload parts, found $($frameParts.Count)." }
          $frameBase64 = ($frameParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $frameBase64 = $frameBase64 -replace '\s', ''
          if ($frameBase64.Length -ne 9124) { throw "Unexpected FrameMerger base64 length: $($frameBase64.Length)." }
          $frameBase64Hash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($frameBase64))).ToLowerInvariant()
          if ($frameBase64Hash -ne '2d064bf8aa2d80559a0e7c84ccb2ff2a374ee01c1ca894f60265870234dfcf46') { throw "FrameMerger base64 hash mismatch: $frameBase64Hash" }
          $compressedFrame = [Convert]::FromBase64String($frameBase64)
          $compressedFrameHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($compressedFrame)).ToLowerInvariant()
          if ($compressedFrameHash -ne '72e6331f60e51938e1d3dfddf466d3cfe58138c3f6b8a5125e28e53974f074d8') { throw "Compressed FrameMerger hash mismatch: $compressedFrameHash" }
          $frameInput = [IO.MemoryStream]::new($compressedFrame)
          try {
            $frameGzip = [IO.Compression.GZipStream]::new($frameInput, [IO.Compression.CompressionMode]::Decompress)
            try {
              $frameOutput = [IO.File]::Create('Services\FrameMerger.cs')
              try { $frameGzip.CopyTo($frameOutput) } finally { $frameOutput.Dispose() }
            } finally { $frameGzip.Dispose() }
          } finally { $frameInput.Dispose() }
          $frameHash = (Get-FileHash 'Services\FrameMerger.cs' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($frameHash -ne '6caa2ac2a163d21599b47b99322b70574b6fc3244390b665764a992b6fe2e82e') { throw "FrameMerger source hash mismatch: $frameHash" }

          Get-ChildItem -Recurse -File | Where-Object {
            $_.FullName -notmatch '\\.git\\|\\bin\\|\\obj\\|\\artifacts\\|\\.build-overlay|\\.build-overlay-supplement|\\.bughunt-fixes|\\.bughunt-hotfix|\\.bughunt-frame'
          } | Sort-Object FullName | ForEach-Object {
            [pscustomobject]@{
              Path = [IO.Path]::GetRelativePath($PWD.Path, $_.FullName)
              Bytes = $_.Length
              SHA256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            }
          } | Export-Csv 'artifacts\reports\fixed-source-inventory.csv' -NoTypeInformation -Encoding utf8

      - name: Restore application and harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet --info | Tee-Object -FilePath 'artifacts\reports\dotnet-info.txt'
          dotnet restore NewDicomMerger.csproj -r win-x64 2>&1 | Tee-Object -FilePath 'artifacts\reports\restore-app.log'
          dotnet restore BugHuntHarness\BugHuntHarness.csproj -r win-x64 2>&1 | Tee-Object -FilePath 'artifacts\reports\restore-harness.log'

      - name: Build application with maximum analyzers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build NewDicomMerger.csproj -c Release -r win-x64 --no-restore -p:ContinuousIntegrationBuild=true -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest-all -p:EnforceCodeStyleInBuild=true -p:TreatWarningsAsErrors=false 2>&1 | Tee-Object -FilePath 'artifacts\reports\analyzer-build.log'

      - name: Build synthetic regression harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build BugHuntHarness\BugHuntHarness.csproj -c Release -r win-x64 --no-restore -p:ContinuousIntegrationBuild=true -p:EnableNETAnalyzers=true -p:AnalysisLevel=latest-recommended -p:TreatWarningsAsErrors=false 2>&1 | Tee-Object -FilePath 'artifacts\reports\harness-build.log'

      - name: Run synthetic regression harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet run --project BugHuntHarness\BugHuntHarness.csproj -c Release -r win-x64 --no-build --no-restore 2>&1 | Tee-Object -FilePath 'artifacts\reports\regression-harness.log'

      - name: Dependency vulnerability report
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet list NewDicomMerger.csproj package --vulnerable --include-transitive --format json | Set-Content 'artifacts\reports\vulnerable-packages.json' -Encoding utf8
          dotnet list NewDicomMerger.csproj package --outdated --include-transitive --format json | Set-Content 'artifacts\reports\outdated-packages.json' -Encoding utf8

      - name: Publish and extended smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish NewDicomMerger.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -p:DebugType=None -p:DebugSymbols=false -p:ContinuousIntegrationBuild=true -o artifacts\publish 2>&1 | Tee-Object -FilePath 'artifacts\reports\publish.log'
          $exe = Resolve-Path 'artifacts\publish\NewDicomMerger.exe'
          $info = Get-Item $exe
          if ($info.Length -lt 10MB) { throw "Executable is unexpectedly small: $($info.Length) bytes." }
          $stream = [IO.File]::OpenRead($exe)
          try {
            if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) { throw 'Executable has no valid Windows PE MZ header.' }
          } finally { $stream.Dispose() }
          $unexpected = @(Get-ChildItem 'artifacts\publish' -File | Where-Object Name -ne 'NewDicomMerger.exe')
          if ($unexpected.Count -gt 0) { throw "Single-file publish contains unexpected files: $($unexpected.Name -join ', ')" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { throw "Application exited unexpectedly with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
          $process.WaitForExit()
          $info | Select-Object FullName,Length,CreationTimeUtc,LastWriteTimeUtc | ConvertTo-Json | Set-Content 'artifacts\reports\published-executable.json' -Encoding utf8
          Get-FileHash $exe -Algorithm SHA256 | ConvertTo-Json | Set-Content 'artifacts\reports\published-executable-hash.json' -Encoding utf8

      - name: Package corrected source, reports and executable
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceStage = Join-Path $env:RUNNER_TEMP 'corrected-source'
          New-Item -ItemType Directory -Force $sourceStage | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -notin @('.git','bin','obj','artifacts','.build-overlay','.build-overlay-supplement','.bughunt-fixes','.bughunt-hotfix','.bughunt-frame') } | ForEach-Object {
            Copy-Item $_.FullName -Destination $sourceStage -Recurse -Force
          }
          Get-ChildItem $sourceStage -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force
          Compress-Archive -Path "$sourceStage\*" -DestinationPath 'artifacts\NewDicomMerger-corrected-source.zip' -CompressionLevel Optimal
          if (Test-Path 'artifacts\reports') {
            Compress-Archive -Path 'artifacts\reports\*' -DestinationPath 'artifacts\NewDicomMerger-bughunt-reports.zip' -CompressionLevel Optimal
          }
          if (Test-Path 'artifacts\publish\NewDicomMerger.exe') {
            $packageStage = Join-Path $env:RUNNER_TEMP 'single-exe-package'
            New-Item -ItemType Directory -Force $packageStage | Out-Null
            Copy-Item 'artifacts\publish\NewDicomMerger.exe' "$packageStage\NewDicomMerger.exe"
            $hash = Get-FileHash "$packageStage\NewDicomMerger.exe" -Algorithm SHA256
            "$($hash.Hash)  NewDicomMerger.exe" | Set-Content "$packageStage\SHA256SUMS.txt" -Encoding ascii
            Compress-Archive -Path "$packageStage\*" -DestinationPath 'artifacts\NewDicomMerger-net10-fixed-single-exe.zip' -CompressionLevel Optimal
          }

      - name: Upload corrected artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NewDicomMerger-net10-bughunt-fixed
          path: |
            artifacts/NewDicomMerger-corrected-source.zip
            artifacts/NewDicomMerger-bughunt-reports.zip
            artifacts/NewDicomMerger-net10-fixed-single-exe.zip
            artifacts/publish/NewDicomMerger.exe
            artifacts/reports/**
          if-no-files-found: warn
          retention-days: 30